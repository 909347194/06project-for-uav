[project]
name = "uav-task-allocation1"
version = "0.2.0"
description = "task_allocation1：多机巢多无人机协同任务分配纯计算内核（同巢起降：从哪个巢起飞就返回哪个巢）"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",        # DE 种群矩阵 / 代价矩阵唯一计算底子
]

[project.optional-dependencies]
# 本包核心是纯计算：无服务壳、无 Web 框架依赖，距离口径由调用方注入。
# 需要 ta1 自己读 GeoTIFF / Shapefile 时安装 terrain 额外依赖；不装也能用
# numpy 数组或调用方自己的采样器。
terrain = [
    "pillow>=10",
    "pyshp>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task_allocation1"]
