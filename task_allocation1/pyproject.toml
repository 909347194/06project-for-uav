[project]
name = "uav-task-allocation1"
version = "0.2.0"
description = "task_allocation1：多机巢多无人机协同任务分配纯计算内核（同巢起降：从哪个巢起飞就返回哪个巢）"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",        # DE 种群矩阵 / 代价矩阵唯一计算底子
    "pillow>=10",         # 读 GeoTIFF DEM
    "pyshp>=2.3",         # 读 Shapefile 建筑
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task_allocation1"]
