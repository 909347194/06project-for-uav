<svg viewBox="0 0 760 440" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>阅读指导：按你的用法选一条路径</title>
  <desc>只用 ta1 读文档0的 ta1 部分加文档1；只用 pp1 读文档0的 pp1 部分加文档2；整套再读文档3对接与文档4完整流程。每份怎么用文档都按准备数据、配参数、用 API、解读结果四件事展开。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .h1   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 16px; font-weight: 600; fill: #1F2937; }
      .sub  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 11px; fill: #6B7280; }
      .ph   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 600; }
      .doc  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 12px; font-weight: 600; fill: #1F2937; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 11px; fill: #4B5563; }
      .mute { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 11px; fill: #9CA3AF; }
      .out  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 11px; font-weight: 600; fill: #1F2937; }
      .num  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 10px; font-weight: 600; fill: #FFFFFF; }
      .foot { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 12px; font-weight: 600; fill: #374151; }
    </style>
  </defs>

  <!-- 标题 -->
  <text class="h1" x="24" y="34">按你的用法，选一条阅读路径</text>
  <text class="sub" x="24" y="56">文档0 讲数据，是所有路径的公共起点；先读它对应的部分，再按路径选读「怎么用」与对接文档。</text>

  <!-- 路径1：只用 ta1 -->
  <rect x="24" y="74" width="228" height="252" rx="12" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.8"/>
  <text class="ph" x="40" y="100" fill="#1F5FA8">① 只用 ta1 · 做任务分配</text>
  <line x1="38" y1="114" x2="238" y2="114" stroke="#378ADD" stroke-width="0.6" opacity="0.5"/>
  <circle cx="46" cy="134" r="8" fill="#378ADD"/><text class="num" x="46" y="134" text-anchor="middle" dominant-baseline="central">1</text>
  <text class="doc" x="62" y="138">文档0 · 数据准备（§1–§6）</text>
  <text class="desc" x="62" y="154">三类实体、同巢要求、距离尺子</text>
  <circle cx="46" cy="178" r="8" fill="#378ADD"/><text class="num" x="46" y="178" text-anchor="middle" dominant-baseline="central">2</text>
  <text class="doc" x="62" y="182">文档1 · 怎么用 ta1</text>
  <text class="desc" x="62" y="198">安装、allocate、配置、读结果</text>
  <circle cx="46" cy="222" r="8" fill="#B8C9D9"/><text class="num" x="46" y="222" text-anchor="middle" dominant-baseline="central">–</text>
  <text class="mute" x="62" y="226">不必读：文档2 / 3 / 4</text>
  <text class="desc" x="62" y="242">pp1、对接、整套流程都与你无关</text>
  <rect x="38" y="288" width="200" height="26" rx="6" fill="#FFFFFF" stroke="#378ADD" stroke-width="0.6"/>
  <text class="out" x="52" y="305" fill="#1F5FA8">→ 交付物：tours 分配方案</text>

  <!-- 路径2：只用 pp1 -->
  <rect x="266" y="74" width="228" height="252" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.8"/>
  <text class="ph" x="282" y="100" fill="#127A56">② 只用 pp1 · 做航迹规划</text>
  <line x1="280" y1="114" x2="480" y2="114" stroke="#1D9E75" stroke-width="0.6" opacity="0.5"/>
  <circle cx="288" cy="134" r="8" fill="#1D9E75"/><text class="num" x="288" y="134" text-anchor="middle" dominant-baseline="central">1</text>
  <text class="doc" x="304" y="138">文档0 · 数据准备（§7–§13）</text>
  <text class="desc" x="304" y="154">世界目录、region / building / DEM</text>
  <circle cx="288" cy="178" r="8" fill="#1D9E75"/><text class="num" x="288" y="178" text-anchor="middle" dominant-baseline="central">2</text>
  <text class="doc" x="304" y="182">文档2 · 怎么用 pp1</text>
  <text class="desc" x="304" y="198">建场、plan、配置、结果、失败码</text>
  <circle cx="288" cy="222" r="8" fill="#A8CFC0"/><text class="num" x="288" y="222" text-anchor="middle" dominant-baseline="central">–</text>
  <text class="mute" x="304" y="226">不必读：文档1 / 3 / 4</text>
  <text class="desc" x="304" y="242">ta1、对接、整套流程都与你无关</text>
  <rect x="280" y="288" width="200" height="26" rx="6" fill="#FFFFFF" stroke="#1D9E75" stroke-width="0.6"/>
  <text class="out" x="294" y="305" fill="#127A56">→ 交付物：轨迹 + 真时长</text>

  <!-- 路径3：整套 -->
  <rect x="508" y="74" width="228" height="252" rx="12" fill="#F7F2E7" stroke="#A88A52" stroke-width="0.8"/>
  <text class="ph" x="524" y="100" fill="#8A6A25">③ 整套 · 分配 + 规划 + 复核</text>
  <line x1="522" y1="114" x2="722" y2="114" stroke="#A88A52" stroke-width="0.6" opacity="0.5"/>
  <circle cx="530" cy="134" r="8" fill="#A88A52"/><text class="num" x="530" y="134" text-anchor="middle" dominant-baseline="central">1</text>
  <text class="doc" x="546" y="138">文档0 · 数据准备（全文）</text>
  <text class="desc" x="546" y="154">两套数据 + 统一坐标口径</text>
  <circle cx="530" cy="178" r="8" fill="#A88A52"/><text class="num" x="530" y="178" text-anchor="middle" dominant-baseline="central">2</text>
  <text class="doc" x="546" y="182">文档1 + 文档2 · 怎么用</text>
  <text class="desc" x="546" y="198">分别跑通两个库的 API</text>
  <circle cx="530" cy="222" r="8" fill="#A88A52"/><text class="num" x="530" y="222" text-anchor="middle" dominant-baseline="central">3</text>
  <text class="doc" x="546" y="226">文档3 · 对接</text>
  <text class="desc" x="546" y="242">责任边界、展开航段、只报差距</text>
  <circle cx="530" cy="266" r="8" fill="#A88A52"/><text class="num" x="530" y="266" text-anchor="middle" dominant-baseline="central">4</text>
  <text class="doc" x="546" y="270">文档4 · 完整流程教程</text>
  <text class="desc" x="546" y="286">首次使用，从头到尾走一遍</text>

  <!-- 底部：每份文档的阅读主线 -->
  <rect x="24" y="344" width="712" height="80" rx="12" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="0.8"/>
  <text class="foot" x="40" y="368">读任何一份「怎么用」文档，都抓住这四件事（即每份文档的编排主线）：</text>
  <rect x="40" y="380" width="148" height="30" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.6"/>
  <text class="foot" x="114" y="399" text-anchor="middle">① 准备什么数据</text>
  <line x1="192" y1="395" x2="208" y2="395" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="212" y="380" width="148" height="30" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.6"/>
  <text class="foot" x="286" y="399" text-anchor="middle">② 配什么参数</text>
  <line x1="364" y1="395" x2="380" y2="395" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="384" y="380" width="148" height="30" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.6"/>
  <text class="foot" x="458" y="399" text-anchor="middle">③ 怎么用 API</text>
  <line x1="536" y1="395" x2="552" y2="395" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="556" y="380" width="164" height="30" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.6"/>
  <text class="foot" x="638" y="399" text-anchor="middle">④ 怎么解读结果</text>
</svg>
